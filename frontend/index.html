<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown 可执行笔记工具</title>
  <!-- highlight.js 样式随主题切换：href 由 JS 注入（构建产物 URL），默认深色 -->
  <link id="hljs-theme" rel="stylesheet" href="" />
</head>

<body>

  <!-- ============ 顶部工具栏 ============ -->
  <header class="topbar">
    <button id="btn-sidebar" class="btn btn-icon" aria-label="折叠/展开侧栏" title="折叠/展开侧栏">📁</button>
    <div class="brand">
      <span class="logo">📓</span>
      <span class="name">可执行笔记</span>
      <span class="ver">v0.3.1</span>
    </div>

    <button id="btn-new"  class="btn btn-sm" aria-label="新建笔记" title="新建笔记">＋ 新建</button>
    <button id="btn-save" class="btn btn-sm" aria-label="保存 (Ctrl+S)" title="保存 (Ctrl+S)">💾 保存</button>
    <button id="btn-autosave" class="btn btn-sm btn-toggle" aria-pressed="false"
            title="每 10 秒自动保存一次">自动保存</button>

    <div class="tb-sep"></div>

    <!-- 两个运行按钮之间用分隔线隔开，防误触 -->
    <button id="btn-run" class="btn btn-primary btn-sm" aria-label="运行光标处的代码块 (Shift+Enter)"
            title="执行光标处的代码块 (Shift+Enter)">▶ 运行当前块</button>
    <div class="tb-sep"></div>
    <button id="btn-run-all" class="btn btn-sm" aria-label="依次执行全部代码块"
            title="依次执行全部代码块（每块独立进程，无共享变量）">≫ 运行全部</button>

    <div class="tb-sep"></div>

    <!-- 三段布局切换，当前项高亮 -->
    <div class="seg" id="seg-layout" role="group" aria-label="布局切换">
      <button data-layout="editor"  title="仅编辑器">编辑</button>
      <button data-layout="split"   class="active" title="左编辑右预览（推荐）">分栏</button>
      <button data-layout="preview" title="仅预览">预览</button>
    </div>

    <div class="tb-spacer"></div>
    <span id="status-tip" role="status">就绪</span>
    <button id="btn-theme" class="btn btn-icon" aria-label="切换深色/浅色主题" title="切换深色/浅色主题">☀️</button>
  </header>

  <!-- ============ 主体工作区 ============ -->
  <div class="workspace" id="workspace" data-layout="split">

    <!-- 左：笔记 / 搜索 / AI 三页签侧栏（指令文档·九.2） -->
    <aside class="sidebar" id="sidebar">
      <div class="side-tabs" role="tablist">
        <button class="side-tab active" id="tab-notes" data-tab="notes" role="tab" aria-label="笔记列表">📁 笔记</button>
        <button class="side-tab" id="tab-search" data-tab="search" role="tab" aria-label="全文搜索">🔍 搜索</button>
        <button class="side-tab" id="tab-ai" data-tab="ai" role="tab" aria-label="AI 助手">🤖 AI</button>
      </div>

      <!-- 页签一：笔记列表 -->
      <div class="side-page" id="page-notes">
        <ul id="note-list"></ul>
        <div class="side-foot">
          <div class="storage">存储于同级 notebooks/ · 标准 .md 格式</div>
          <div class="exec-badge local" id="exec-badge"></div>
        </div>
      </div>

      <!-- 页签二：全文搜索（Whoosh） -->
      <div class="side-page hidden" id="page-search">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="搜索标题 / 正文 / 文件名… (Ctrl+K)"
                 aria-label="搜索笔记" autocomplete="off" />
          <button id="btn-reindex" class="btn btn-icon btn-sm" aria-label="重建索引"
                  title="全量重建搜索索引">🔄</button>
        </div>
        <div id="search-state" class="search-state hidden" aria-live="polite"></div>
        <ul id="search-results" aria-label="搜索结果"></ul>
      </div>

      <!-- 页签三：AI 助手（FR-11） -->
      <div class="side-page hidden" id="page-ai">
        <div class="ai-head">
          <span class="title">AI 笔记助手</span>
          <button id="btn-ai-clear" class="btn btn-icon btn-sm" aria-label="清空对话" title="清空对话">🧹</button>
          <button id="btn-ai-settings" class="btn btn-icon btn-sm" aria-label="配置 API 服务" title="配置 API 服务">⚙️</button>
        </div>
        <div id="ai-need-key" class="hidden">
          请先配置 API Key 以使用 AI 助手 —— <u>点击此处打开设置</u>
        </div>
        <div id="ai-messages">
          <div class="ai-hint">我可以总结笔记、润色文字、解释或生成代码。<br/>回答会引用你当前打开的笔记作为上下文。</div>
        </div>
        <div class="ai-input-box">
          <textarea id="ai-input" rows="3" placeholder="输入问题，Enter 发送…" aria-label="AI 提问输入框"></textarea>
          <div class="ai-actions">
            <button id="btn-ai-send" class="btn btn-primary btn-sm" style="flex:1">发送</button>
            <button id="btn-ai-summarize" class="btn btn-sm" title="总结当前笔记">总结</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- 中：标签栏 + Monaco 编辑器（FR-01） -->
    <section class="editor-stack" id="editor-pane">
      <div class="tabbar">
        <span class="file-tab" id="file-tab" title="">
          <span>📄</span>
          <span class="t-name" id="file-tab-name">未命名</span>
          <i class="dirty-dot hidden" id="file-tab-dirty">●</i>
        </span>
        <span class="indep-tip">ⓘ 每个代码块独立执行，不共享变量</span>
      </div>
      <div id="editor"><div class="editor-loading">加载编辑器…</div></div>
    </section>

    <!-- 右：实时预览 + 执行结果（FR-02/03/07） -->
    <section class="preview-pane" id="preview-pane">
      <div id="preview" class="markdown-body"></div>
    </section>
  </div>

  <!-- ============ AI 设置弹窗：由 components/AIConfigModal.js 基于通用 Modal 动态渲染 ============ -->

  <!-- ============ 底部状态栏 ============ -->
  <footer class="statusbar">
    <span id="status-file">未命名.md</span>
    <span class="dirty" id="status-dirty"></span>
    <span class="dot">·</span>
    <span id="status-lines">行 1，列 1</span>
    <div class="spacer"></div>
    <span id="status-runtimes" title="本机代码执行环境"></span>
    <span class="dot" id="status-runtimes-dot" style="display:none">·</span>
    <span id="status-ai">AI：未配置</span>
    <span class="dot">·</span>
    <span id="status-executor">执行器：local</span>
    <span class="dot">·</span>
    <span><kbd>Shift+Enter</kbd> 运行 <kbd>Ctrl+S</kbd> 保存 <kbd>Ctrl+K</kbd> 搜索</span>
  </footer>

  <!-- 全局 Toast 容器（指令文档·七：错误用 Toast，不阻塞界面） -->
  <div id="toast-stack" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
